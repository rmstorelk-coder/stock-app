<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stock Manager</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14181f;--mut:#6b7280;--bd:#e3e6ea;--ac:#0f766e;--acx:#fff;--red:#b91c1c;--redbg:#fee2e2;--grn:#166534;--grnbg:#dcfce7;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1116;--card:#171b22;--tx:#eceff4;--mut:#9aa3b2;--bd:#2a303a;--ac:#2dd4bf;--acx:#06201c;--red:#fca5a5;--redbg:#451a1a;--grn:#86efac;--grnbg:#14301e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1116;--card:#171b22;--tx:#eceff4;--mut:#9aa3b2;--bd:#2a303a;--ac:#2dd4bf;--acx:#06201c;--red:#fca5a5;--redbg:#451a1a;--grn:#86efac;--grnbg:#14301e;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.w{max-width:560px;margin:0 auto;padding:14px 14px 90px}
h1{font-size:20px;margin:6px 0 12px}
#sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
#sum div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;text-align:center}
#sum b{display:block;font-size:20px}#sum span{font-size:12px;color:var(--mut)}#sum .warn b{color:var(--red)}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;padding:9px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:14px}
.tabs button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
input,select{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font-size:16px}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-top:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.nm{font-weight:600}.mut{color:var(--mut);font-size:13px}
.q{font-size:20px;font-weight:700;padding:2px 10px;border-radius:8px;background:var(--grnbg);color:var(--grn)}
.q.low{background:var(--redbg);color:var(--red)}
.acts{display:flex;gap:6px;margin-top:10px}
.acts button,.btn{flex:1;padding:9px;border-radius:9px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:14px}
.btn.p{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}.btn.d{color:var(--red)}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));padding:14px 20px;border-radius:30px;border:0;background:var(--ac);color:var(--acx);font-size:15px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#m{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:5}
#m.on{display:flex}
#m>div{background:var(--bg);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
.in{color:var(--grn)}.out{color:var(--red)}.empty{text-align:center;color:var(--mut);padding:30px 10px}
</style></head><body><div class="w">
<h1>📦 Stock Manager</h1>
<div id="st" class="mut" style="margin:-6px 0 10px"></div>
<div id="sum"></div>
<div class="tabs"><button id="t1" onclick="tab='stock';render()">Stock</button><button id="t2" onclick="tab='log';render()">History</button></div>
<div id="c"></div>
</div>
<button class="fab" onclick="openItem()">+ Add item</button>
<div id="m"><div id="mb"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
let S={items:[],log:[]},tab='stock',q='';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const SUPABASE_URL='https://znsquyzhenvjcfrxfhkl.supabase.co',SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpuc3F1eXpoZW52amNmcnhmaGtsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzOTU5NDIsImV4cCI6MjEwODk3MTk0Mn0.3UhYclJ6DDkzt8nKJkFpklsuiF-hSShEnFHabHvQIX8';
let DB=null;
const err=e=>{$('st').textContent='⚠ '+((e&&e.message)||'Save failed')};
const ok=r=>{if(r&&r.error)err(r.error);return r};
function put(it){DB.from('items').upsert(it).then(ok)}
function addLog(l){DB.from('log').insert(l).then(ok)}
function rm(id){S.items=S.items.filter(x=>x.id!==id);DB.from('items').delete().eq('id',id).then(ok);hide();render()}
async function load(){
 const a=await DB.from('items').select('*'),b=await DB.from('log').select('*').order('t',{ascending:false}).limit(100);
 if(a.error||b.error){err(a.error||b.error);return}
 S.items=a.data.map(i=>({...i,qty:+i.qty,min:+i.min,price:+i.price}));S.log=b.data;
 $('st').textContent='☁ Synced (cloud)';render();
}
function init(){
 if(SUPABASE_URL.startsWith('PASTE')||!window.supabase){$('st').textContent='Setup pending: add Supabase URL and key';return}
 DB=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);load();setInterval(()=>{if(!$('m').classList.contains('on'))load()},15000);
}
const n=v=>Math.max(0,parseFloat(v)||0);
function render(){
 const it=S.items,low=it.filter(i=>i.qty<=i.min).length,val=it.reduce((a,i)=>a+i.qty*i.price,0);
 $('sum').innerHTML=`<div><b>${it.length}</b><span>Items</span></div><div class="${low?'warn':''}"><b>${low}</b><span>Low stock</span></div><div><b>${Math.round(val).toLocaleString()}</b><span>Stock value</span></div>`;
 $('t1').className=tab==='stock'?'on':'';$('t2').className=tab==='log'?'on':'';
 let h='';
 if(tab==='stock'){
  h='<input id="s" placeholder="Search item or category…" value="'+esc(q)+'" oninput="q=this.value;list()"><div id="l"></div>';
  if(!$('s'))$('c').innerHTML=h;list();
 }else{
  h=S.log.length?S.log.slice(0,100).map(l=>`<div class="card row"><div><div class="nm">${esc(l.name)}</div><div class="mut">${new Date(l.t).toLocaleString()}${l.note?' · '+esc(l.note):''}</div></div><b class="${l.d>0?'in':'out'}">${l.d>0?'+':''}${l.d}</b></div>`).join(''):'<div class="empty">No movements yet</div>';
  $('c').innerHTML=h;
 }
}
function list(){
 const k=q.toLowerCase();
 const a=S.items.filter(i=>(i.name+' '+i.cat).toLowerCase().includes(k)).sort((x,y)=>(y.qty<=y.min)-(x.qty<=x.min)||x.name.localeCompare(y.name));
 $('l').innerHTML=a.length?a.map(i=>`<div class="card"><div class="row"><div><div class="nm">${esc(i.name)}</div><div class="mut">${esc(i.cat||'No category')} · Min ${i.min} · Price ${i.price}</div></div><span class="q ${i.qty<=i.min?'low':''}">${i.qty}</span></div>${i.qty<=i.min?'<div class="mut out" style="margin-top:6px">⚠ Low stock</div>':''}<div class="acts"><button onclick="openMove('${i.id}',1)">+ In</button><button onclick="openMove('${i.id}',-1)">− Out</button><button onclick="openItem('${i.id}')">Edit</button></div></div>`).join(''):'<div class="empty">'+(S.items.length?'No match':'No items yet. Tap “Add item”.')+'</div>';
}
function show(h){$('mb').innerHTML=h;$('m').classList.add('on')}
function hide(){$('m').classList.remove('on')}
$('m').addEventListener('click',e=>{if(e.target===$('m'))hide()});
function openItem(id){
 const i=S.items.find(x=>x.id===id)||{name:'',cat:'',qty:0,min:5,price:0};
 show(`<div class="nm" style="font-size:17px">${id?'Edit item':'New item'}</div>
 <label>Item name</label><input id="f1" value="${esc(i.name)}">
 <label>Category</label><input id="f2" value="${esc(i.cat)}" placeholder="e.g. Spare parts">
 ${id?'':`<label>Opening quantity</label><input id="f3" type="number" inputmode="decimal" value="0">`}
 <label>Low-stock level (alert at or below)</label><input id="f4" type="number" inputmode="decimal" value="${i.min}">
 <label>Unit price</label><input id="f5" type="number" inputmode="decimal" value="${i.price}">
 <div class="acts" style="margin-top:16px">${id?`<button class="btn d" onclick="del('${id}')">Delete</button>`:''}<button class="btn" onclick="hide()">Cancel</button><button class="btn p" onclick="saveItem('${id||''}')">Save</button></div>`);
}
function saveItem(id){
 const name=$('f1').value.trim();if(!name){$('f1').focus();return}
 const d={name,cat:$('f2').value.trim(),min:n($('f4').value),price:n($('f5').value)};
 if(id){const it=S.items.find(x=>x.id===id);Object.assign(it,d);put(it)}
 else{const qty=n($('f3').value),it={id:uid(),qty,...d};S.items.push(it);put(it);if(qty)addLog({t:Date.now(),name,d:qty,note:'Opening stock'})}
 hide();render();
}
function del(id){
 show(`<div class="nm" style="font-size:17px">Delete this item?</div><p class="mut">This cannot be undone.</p><div class="acts"><button class="btn" onclick="hide()">Cancel</button><button class="btn p" style="background:var(--red);border-color:var(--red);color:#fff" onclick="rm('${id}')">Delete</button></div>`);
}
function openMove(id,s){
 const i=S.items.find(x=>x.id===id);
 show(`<div class="nm" style="font-size:17px">${s>0?'Stock in':'Stock out'}: ${esc(i.name)}</div><div class="mut">Current: ${i.qty}</div>
 <label>Quantity</label><input id="g1" type="number" inputmode="decimal" value="1" min="0">
 <label>Note (optional)</label><input id="g2" placeholder="${s>0?'Supplier, bill no…':'Customer, job…'}">
 <div id="err" class="out mut"></div>
 <div class="acts" style="margin-top:16px"><button class="btn" onclick="hide()">Cancel</button><button class="btn p" onclick="move('${id}',${s})">Save</button></div>`);
}
async function move(id,s){
 const i=S.items.find(x=>x.id===id),v=n($('g1').value);
 if(!v){$('g1').focus();return}
 if(s<0&&v>i.qty){$('err').textContent='Only '+i.qty+' in stock.';return}
 let cur=i.qty;
 if(DB){const r=await DB.from('items').select('qty').eq('id',id).single();if(r.data)cur=+r.data.qty}
 if(s<0&&v>cur){$('err').textContent='Only '+cur+' in stock.';return}
 i.qty=cur+s*v;put(i);addLog({t:Date.now(),name:i.name,d:s*v,note:$('g2').value.trim()||null});hide();render();
}
render();init();
</script></body></html>
