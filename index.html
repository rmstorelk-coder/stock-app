async function doImport(){
 const f=$('xf').files[0];if(!f){$('xs').textContent='Choose a file first.';return}
 $('xb').disabled=true;$('xs').textContent='Reading file…';
 try{
  await loadXlsx();
  const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
  const hd=(rows[0]||[]).map(h=>String(h).trim().toLowerCase());
  const ix=k=>hd.findIndex(h=>h.startsWith(k));
  const c={alias:ix('alias'),name:ix('name'),brand:ix('brand'),grp:ix('group'),purc:ix('purc'),sale:ix('sale')};
  if(c.name<0||c.grp<0||c.purc<0||c.sale<0){$('xs').textContent='Columns not found. Need: Name, Group Name, Purc. Price, Sale Price.';$('xb').disabled=false;return}
  const g=(w,k)=>c[k]<0||w[c[k]]==null?'':String(w[c[k]]).trim();
  const raw=[];
  for(let r=1;r<rows.length;r++){const w=rows[r],o={alias:g(w,'alias'),name:g(w,'name'),brand:g(w,'brand'),grp:g(w,'grp'),purc:parseFloat(w[c.purc])||0,sale:parseFloat(w[c.sale])||0,n:r};if(!o.name&&!o.alias&&!o.grp)continue;raw.push(o)}
  if(!raw.length){$('xs').textContent='No items found in file.';$('xb').disabled=false;return}
  const cg=canon(raw.map(o=>o.grp)),cb=canon(raw.map(o=>o.brand)),ex=new Map(S.items.map(i=>[i.id,i])),now=Date.now();
  const recs=raw.map(o=>{const id='im'+o.n,e=ex.get(id);return{id,name:(o.name||o.alias||'Unnamed').slice(0,120),cat:cg[o.grp.toLowerCase()]||o.grp,brand:cb[o.brand.toLowerCase()]||o.brand,code:o.alias.slice(0,60),qty:e?e.qty:0,min:e?e.min:0,cost:o.purc,price:o.sale,upd:now}});
  for(let k=0;k<recs.length;k+=500){
   $('xs').textContent='Uploading '+Math.min(k+500,recs.length)+' / '+recs.length+'…';
   const r=await DB.from('items').upsert(recs.slice(k,k+500));
   if(r.error){$('xs').textContent='⚠ '+r.error.message;$('xb').disabled=false;return}
  }
  if($('xc').checked){
   const ids=S.items.filter(i=>!String(i.id).startsWith('im')&&!i.qty&&!i.cost&&!i.price).map(i=>i.id);
   for(let k=0;k<ids.length;k+=100)await DB.from('items').delete().in('id',ids.slice(k,k+100));
  }
  $('xs').textContent='Done. Loading…';
  await load(true);hide();
 }catch(e){$('xs').textContent='⚠ '+(e.message||e);$('xb').disabled=false}
}

function updPrev(){const e=$('bpv');if(!e)return;const sup=isSup(),has=B.cn.trim()||B.cp.trim(),d=has?(sup?supDueFor(B.cn,B.cp):dueFor(B.cn,B.cp)):0;e.innerHTML=d>0?'<b class="out">'+(sup?'Payable to supplier: ':'Previous credit balance: ')+fm(d)+'</b>':''}
function pts(){const e=$('ptseg');if(!e)return;e.innerHTML=[['retail','Retail price'],['wholesale','Wholesale price']].map(x=>`<button class="${B.pt===x[0]?'on':''}" onclick="setPT('${x[0]}')">${x[1]}</button>`).join('')}
function repriceCart(){B.cart.forEach(l=>{const i=S.items.find(x=>x.id===l.id);if(i)l.price=unit(i)});rcart();bt()}
function setPT(v){B.pt=v;pts();repriceCart()}
function buildBill(){
 const m=B.mode,R=m==='return'||m==='sreturn',sup=isSup();
 const segs=sup?[['purchase','Purchase'],['sreturn','↩ Return to supplier']]:[['sale','Sale'],['return','↩ Return']];
 const hint=m==='sale'?' (needed for credit)':m==='return'?' (needed to adjust credit)':m==='sreturn'?' (needed to adjust payable)':'';
 const methods=m==='purchase'?['Cash','Bank','Credit']:['Cash','Card','Bank','Credit'];
 let bottom;
 if(R)bottom=`<div class="card"><div id="bsum"></div><div id="bdue" style="margin-top:6px"></div><label>${sup?'Adjust against payable to supplier':'Adjust against customer credit'}</label><input id="ba" type="number" inputmode="decimal" oninput="B.aa=true;B.adj=n(this.value);bt(true)"></div>`;
 else bottom=`<div class="card">${m==='sale'?`<div class="row"><label style="margin:0">Discount</label><input id="bd" type="number" inputmode="decimal" style="width:130px;text-align:right" value="${B.disc||''}" placeholder="0" oninput="B.disc=n(this.value);bt()"></div>`:''}
 <div id="bsum" style="margin-top:8px"></div>
 <label>Payment</label><select id="bm" onchange="B.method=this.value;B.pa=false;bt()">${methods.map(x=>`<option ${B.method===x?'selected':''}>${x}</option>`).join('')}</select>
 <label>Paid now</label><input id="bp" type="number" inputmode="decimal" oninput="B.pa=true;B.paid=n(this.value);bt(true)">
 <div id="bdue" style="margin-top:6px"></div>
 ${m==='purchase'?`<label style="display:flex;gap:8px;align-items:center;color:var(--tx);font-size:14px;margin-top:12px"><input type="checkbox" ${B.upc?'checked':''} style="width:auto;padding:0" onchange="B.upc=this.checked"> Update item cost prices with these prices</label>`:''}</div>`;
 const btn={sale:['billSave','Save &amp; Invoice'],return:['retSave','Save return'],purchase:['purSave','Save purchase'],sreturn:['srSave','Save supplier return']}[m];
 $('c').innerHTML=`<div id="bill"><div class="seg">${segs.map(x=>`<button class="${m===x[0]?'on':''}" onclick="setMode('${x[0]}')">${x[1]}</button>`).join('')}</div>
 <div class="card"><label style="margin-top:0">${sup?'Supplier name':'Customer name'}${hint}</label><input id="bcn" list="cl" autocomplete="off" value="${esc(B.cn)}" oninput="B.cn=this.value;pickCust();updPrev();bt()"><datalist id="cl"></datalist>
 <label>Phone</label><div class="row" style="gap:8px"><input id="bcp" inputmode="tel" value="${esc(B.cp)}" oninput="B.cp=this.value;updPrev();bt()" style="flex:1"><button class="btn" style="flex:none;padding:11px 12px" onclick="pickContact('bill')">📇 Contacts</button></div><div id="tpick"></div><div id="bpv" style="margin-top:6px"></div></div>
 <div class="card">${m==='sale'?'<div class="seg" id="ptseg" style="margin-top:0"></div>':''}<label style="margin-top:0">${R?'Returned item':'Add item'}</label><input id="bs" autocomplete="off" placeholder="Type model, e.g. A6X" oninput="bsl()"><div id="br"></div><div id="bl"></div></div>
 ${bottom}
 <div class="acts"><button class="btn" onclick="billReset(true)">Clear</button><button class="btn p" id="bsv" onclick="${btn[0]}()">${btn[1]}</button></div></div>`;
 fillCust();pts();rcart();bt();updPrev();
}
async function pickContact(ctx){
 if(!('contacts' in navigator)||!navigator.contacts.select){alert('Contact picker is not available in this browser. Please use Chrome on Android, or type the number.');return}
 try{
  const r=await navigator.contacts.select(['name','tel'],{multiple:false});
  if(!r||!r.length)return;
  const c=r[0],nm=((c.name||[])[0]||'').trim(),tels=[...new Set((c.tel||[]).map(np).filter(Boolean))];
  if(nm){if(ctx==='bill'){B.cn=nm;if($('bcn'))$('bcn').value=nm}else if($('pn'))$('pn').value=nm}
  if(tels.length)useTel(tels[0],ctx);
  const e=$('tpick');if(e)e.innerHTML=tels.length>1?'<div class="mut" style="margin-top:6px">Other numbers:</div><div class="acts" style="flex-wrap:wrap">'+tels.slice(1).map(t=>`<button class="btn" style="flex:none" onclick="useTel(\''+t+'\',\''+ctx+'\')">${t}</button>`).join('')+'</div>':'';
  if(ctx==='bill'){pickCust();updPrev();bt()}
 }catch(e){}
}
function useTel(t,ctx){if(ctx==='bill'){B.cp=t;if($('bcp'))$('bcp').value=t;updPrev();bt()}else if($('pp'))$('pp').value=t}
function pickCust(){
 const sup=isSup(),c=(sup?SU.list:SA.cust).find(x=>lc(x.name)===lc(B.cn));
 if(!c)return;
 if(!B.cp&&c.phone){B.cp=c.phone;if($('bcp'))$('bcp').value=c.phone}
 if(!sup&&B.mode==='sale'){const t=c.type==='wholesale'?'wholesale':'retail';if(B.pt!==t){B.pt=t;pts();repriceCart()}}
}
let bt0;function bsl(){clearTimeout(bt0);bt0=setTimeout(bsearch,120)}
function bsearch(){
 const terms=lc($('bs').value).split(/\s+/).filter(Boolean);
 if(!terms.length){$('br').innerHTML='';return}
 const out=[];
 for(const i of S.items){const r=tx(i);if(terms.every(t=>r.w.some(x=>x.startsWith(t))||(t.length>2&&r.t.includes(t)))){out.push(i);if(out.length>=40)break}}
 out.sort((x,y)=>(y.qty>0)-(x.qty>0)||(tx(x).k<tx(y).k?-1:1));
 const v=out.slice(0,8),sup=isSup();
 $('br').innerHTML=v.length?'<div class="res">'+v.map(i=>`<div onclick="addCart('${i.id}')"><b>${esc(i.name)}</b><div class="mut">${esc(i.cat||'')}${i.brand?' · '+esc(i.brand):''} · Stock ${i.qty} · ${sup?'Cost '+i.cost:'Price '+i.price+(i.wprice>0?' · Whl '+i.wprice:'')}</div></div>`).join('')+'</div>':'<div class="mut" style="margin-top:6px">No match</div>';
}
function addCart(id){
 const i=S.items.find(x=>x.id===id);if(!i)return;
 const l=B.cart.find(x=>x.id===id);if(l)l.qty=money(l.qty+1);else B.cart.push({id,name:i.name,qty:1,price:isSup()?+i.cost:unit(i),cost:+i.cost});
 $('bs').value='';$('br').innerHTML='';rcart();bt();
}
function rcart(){
 const e=$('bl');if(!e)return;
 e.innerHTML=B.cart.length?B.cart.map((l,k)=>`<div class="card" style="margin-top:8px"><div class="row"><b>${esc(l.name)}</b><button class="x" onclick="rmCart(${k})">✕</button></div><div class="row" style="margin-top:8px"><div class="step"><button onclick="stepQ(${k},-1)">−</button><input id="q${k}" type="number" inputmode="decimal" value="${l.qty}" oninput="setQ(${k},this.value)"><button onclick="stepQ(${k},1)">+</button></div><input class="pr" id="p${k}" type="number" inputmode="decimal" value="${l.price}" oninput="setPr(${k},this.value)"><b id="lt${k}">${fm(l.qty*l.price)}</b></div></div>`).join(''):'<div class="empty" style="padding:14px">No items yet. Search above.</div>';
}
function rmCart(k){B.cart.splice(k,1);rcart();bt()}
function setQ(k,v){B.cart[k].qty=n(v);bt()}
function setPr(k,v){B.cart[k].price=n(v);bt()}
function stepQ(k,d){const l=B.cart[k];l.qty=Math.max(0,money(l.qty+d));$('q'+k).value=l.qty;bt()}
function bsum(){const sub=B.cart.reduce((a,l)=>a+l.qty*l.price,0),cost=B.cart.reduce((a,l)=>a+l.qty*l.cost,0),disc=Math.min(B.disc,sub);return{sub:money(sub),cost:money(cost),disc:money(disc),total:money(sub-disc)}}
function btReturn(fromAdj){
 const sup=isSup(),has=B.cn.trim()||B.cp.trim(),total=money(B.cart.reduce((a,l)=>a+l.qty*l.price,0)),due=has?(sup?supDueFor(B.cn,B.cp):dueFor(B.cn,B.cp)):0,max=Math.min(total,due);
 if(!B.aa)B.adj=max;
 if(B.adj>max)B.adj=max;
 if(!fromAdj&&$('ba'))$('ba').value=B.adj;
 if($('bsum'))$('bsum').innerHTML=`<div class="tot big"><span>Return value</span><span>${fm(total)}</span></div><div class="tot"><span>Adjust against ${sup?'payable':'credit'}</span><span>− ${fm(B.adj)}</span></div><div class="tot big"><span>${sup?'Cash refund from supplier':'Cash refund'}</span><span>${fm(total-B.adj)}</span></div>`;
 if($('bdue'))$('bdue').innerHTML=due>0?`<span>${sup?'You owe supplier':'Customer owes'} <b class="out">${fm(due)}</b></span>`:`<span class="mut">${sup?'No payable. Full refund in cash.':'No credit due. Full cash refund.'}</span>`;
 B.cart.forEach((l,k)=>{const e=$('lt'+k);if(e)e.textContent=fm(l.qty*l.price)});
}
function bt(fromPaid){
 if(B.mode==='return'||B.mode==='sreturn')return btReturn(fromPaid);
 const t=bsum();
 if(!B.pa)B.paid=B.method==='Credit'?0:t.total;
 if(B.paid>t.total)B.paid=t.total;
 if(!fromPaid&&$('bp'))$('bp').value=B.paid;
 if($('bsum'))$('bsum').innerHTML=`<div class="tot"><span>Subtotal</span><span>${fm(t.sub)}</span></div>`+(t.disc?`<div class="tot"><span>Discount</span><span>− ${fm(t.disc)}</span></div>`:'')+`<div class="tot big"><span>Total</span><span>${fm(t.total)}</span></div>`;
 const due=money(t.total-B.paid);
 if($('bdue'))$('bdue').innerHTML=due>0?`<b class="out">Balance due: ${fm(due)} (credit)</b>`:'<span class="mut">Fully paid</span>';
 B.cart.forEach((l,k)=>{const e=$('lt'+k);if(e)e.textContent=fm(l.qty*l.price)});
}
function billReset(keep){B.cart=[];B.cn='';B.cp='';B.disc=0;B.method='Cash';B.pa=false;B.paid=0;B.aa=false;B.adj=0;B.pt='retail';if(!keep){B.mode='sale';if(tab==='purchase'||tab==='sreturn')tab='bill'}$('c').innerHTML='';render()}
async function billSave(){
 const t=bsum(),due=money(t.total-B.paid),lines=B.cart.filter(l=>l.qty>0),name0=B.cn.trim()||B.cp.trim();
 if(!lines.length){alert('Add at least one item.');return}
 if(due>0&&!B.cn.trim()){alert('Enter the customer name for credit or balance.');$('bcn').focus();return}
 $('bsv').disabled=true;
 try{
  await loadSales();const prev=name0?dueFor(B.cn,B.cp):0;
  const sq=await DB.rpc('next_inv');if(sq.error)throw sq.error;
  const inv='RM-'+String(sq.data).padStart(5,'0'),now=Date.now(),name=B.cn.trim(),phone=np(B.cp),cid=name?(phone||lc(name)):'';
  const sale={id:uid(),inv,t:now,cust_id:cid,cust_name:name,cust_phone:phone,items:lines.map(l=>({id:l.id,name:l.name,qty:l.qty,price:l.price,cost:l.cost})),subtotal:t.sub,discount:t.disc,total:t.total,paid:B.paid,due,prev,cost:t.cost,method:B.method,status:'ok',note:B.pt==='wholesale'?'Wholesale':''};
  let r=await DB.from('sales').insert(sale);
  if(r.error&&/prev/.test(r.error.message||'')){const s2={...sale};delete s2.prev;r=await DB.from('sales').insert(s2)}
  if(r.error)throw r.error;
  if(name)await DB.from('customers').upsert({id:cid,name,phone,upd:now});
  for(const l of lines){await DB.rpc('change_qty',{p_id:l.id,p_delta:-l.qty});const it=S.items.find(x=>x.id===l.id);if(it){it.qty=money(it.qty-l.qty);it.upd=now}}
  await DB.from('log').insert(lines.map(l=>({t:now,name:l.name,d:-l.qty,note:'Sale '+inv})));
  billReset();showInvoice(sale,false);loadSales();
 }catch(e){alert('Could not save: '+(e.message||e));const b=$('bsv');if(b)b.disabled=false}
}

function startReturn(id){
 const s=SA.recent.find(x=>x.id===id);if(!s)return;
 B.mode='return';B.aa=false;B.adj=0;B.cn=s.cust_name||'';B.cp=s.cust_phone||'';
 B.cart=s.items.map(l=>({id:l.id,name:l.name,qty:l.qty,price:l.price,cost:l.cost||0}));
 tab='bill';hide();$('c').innerHTML='';render();
}
async function applyPay(bills,amt){
 let rem=amt;
 for(const s of bills.slice().sort((a,b)=>a.t-b.t)){
  if(rem<=0)break;const p=Math.min(rem,+s.due);
  const r=await DB.from('sales').update({paid:money((+s.paid||0)+p),due:money(s.due-p)}).eq('id',s.id);
  if(r.error)throw r.error;rem=money(rem-p);
 }
}
async function applySupPay(bills,amt){
 let rem=amt;
 for(const s of bills.slice().sort((a,b)=>a.t-b.t)){
  if(rem<=0)break;const p=Math.min(rem,+s.due);
  const r=await DB.from('purchases').update({paid:money((+s.paid||0)+p),due:money(s.due-p)}).eq('id',s.id);
  if(r.error)throw r.error;rem=money(rem-p);
 }
}

async function retSave(){
 const lines=B.cart.filter(l=>l.qty>0);
 if(!lines.length){alert('Add at least one returned item.');return}
 const total=money(lines.reduce((a,l)=>a+l.qty*l.price,0)),cost=money(lines.reduce((a,l)=>a+l.qty*l.cost,0));
 $('bsv').disabled=true;
 try{
  await loadSales();
  const name=B.cn.trim(),phone=np(B.cp),cid=name?(phone||lc(name)):'',dueB=(name||phone)?dueFor(B.cn,B.cp):0;
  let adj=money(Math.max(0,Math.min(B.aa?B.adj:dueB,total,dueB)));
  const refund=money(total-adj);
  const sq=await DB.rpc('next_inv');if(sq.error)throw sq.error;
  const inv='RT-'+String(sq.data).padStart(5,'0'),now=Date.now();
  const rt={id:uid(),inv,t:now,cust_id:cid,cust_name:name,cust_phone:phone,items:lines.map(l=>({id:l.id,name:l.name,qty:l.qty,price:l.price,cost:l.cost})),total,cost,adj,refund,note:''};
  const r=await DB.from('returns').insert(rt);if(r.error)throw r.error;
  if(name)await DB.from('customers').upsert({id:cid,name,phone,upd:now});
  for(const l of lines){await DB.rpc('change_qty',{p_id:l.id,p_delta:l.qty});const it=S.items.find(x=>x.id===l.id);if(it){it.qty=money(it.qty+l.qty);it.upd=now}}
  await DB.from('log').insert(lines.map(l=>({t:now,name:l.name,d:l.qty,note:'Return '+inv})));
  if(adj>0){await applyPay(duesOf(name,phone),adj);await DB.from('payments').insert({id:uid(),t:now,cust_id:cid,cust_name:name,amount:adj,method:'Return',note:inv})}
  rt.dueAfter=money(dueB-adj);
  billReset();showReturn(rt);loadSales();

  await DB.from('payments').insert({id:uid(),t:Date.now(),cust_id:g.id,cust_name:g.name,amount:amt,method:$('cpm').value,note:''});
 }catch(e){alert(e.message||e);return}
 hide();loadSales();
}
function show(h){$('mb').innerHTML=h;$('m').classList.add('on')}
function hide(){$('m').classList.remove('on')}
$('m').addEventListener('click',e=>{if(e.target===$('m'))hide()});
function catSel(){$('f2n').style.display=$('f2').value==='__new'?'':'none'}
function openItem(id){
 const i=S.items.find(x=>x.id===id)||{name:'',cat:'',brand:'',code:'',qty:0,min:0,cost:0,price:0};
 const cs=cats(),cur=lc(id?i.cat:cat);
 show(`<div class="nm" style="font-size:17px">${id?'Edit item':'New item'}</div>
 <label>Item name</label><input id="f1" value="${esc(i.name)}">
 <label>Category</label><select id="f2" onchange="catSel()">${cs.map(c=>`<option value="${esc(c)}" ${lc(c)===cur?'selected':''}>${esc(c)}</option>`).join('')}<option value="__new">+ New category…</option></select><input id="f2n" placeholder="New category name" style="display:none;margin-top:6px">
 <label>Brand (optional)</label><input id="f6" value="${esc(i.brand||'')}">
 <label>Code (optional)</label><input id="f7" value="${esc(i.code||'')}">
 ${id?'':`<label>Opening quantity</label><input id="f3" type="number" inputmode="decimal" value="0">`}
 <label>Low-stock alert at or below (0 = no alert)</label><input id="f4" type="number" inputmode="decimal" value="${i.min}">
 <label>Cost price (what you pay)</label><input id="f8" type="number" inputmode="decimal" value="${i.cost}">
 <label>Sale price</label><input id="f5" type="number" inputmode="decimal" value="${i.price}">
 <label>Wholesale price (optional)</label><input id="f9" type="number" inputmode="decimal" value="${i.wprice||0}">
 <div class="acts" style="margin-top:16px">${id?`<button class="btn d" onclick="del('${id}')">Delete</button>`:''}<button class="btn" onclick="hide()">Cancel</button><button class="btn p" onclick="saveItem('${id||''}')">Save</button></div>`);
}
function saveItem(id){
 const name=$('f1').value.trim();if(!name){$('f1').focus();return}
 let c=$('f2').value;if(c==='__new')c=$('f2n').value.trim();if(!c){$('f2n').style.display='';$('f2n').focus();return}
 const d={name,cat:c,brand:$('f6').value.trim(),code:$('f7').value.trim(),min:n($('f4').value),cost:n($('f8').value),price:n($('f5').value),wprice:n($('f9').value)};
 if(id){const it=S.items.find(x=>x.id===id);Object.assign(it,d);tc.delete(it);put(it)}
 else{const qty=n($('f3').value),it={id:uid(),qty,...d};S.items.push(it);put(it);if(qty)addLog({t:Date.now(),name,d:qty,note:'Opening stock'})}
 hide();render();
}
function del(id){
 show(`<div class="nm" style="font-size:17px">Delete this item?</div><p class="mut">This cannot be undone.</p><div class="acts"><button class="btn" onclick="hide()">Cancel</button><button class="btn p" style="background:var(--red);border-color:var(--red);color:#fff" onclick="rm('${id}')">Delete</button></div>`);
}
function openMove(id,s){
 const i=S.items.find(x=>x.id===id);
 show(`<div class="nm" style="font-size:17px">${s>0?'Stock in':'Stock out'}: ${esc(i.name)}</div><div class="mut">Current: ${i.qty}</div>
 <label>Quantity</label><input id="g1" type="number" inputmode="decimal" value="1" min="0">
 <label>Note (optional)</label><input id="g2" placeholder="${s>0?'Supplier, bill no…':'Customer, job…'}">
 <div id="err" class="out mut"></div>
 <div class="acts" style="margin-top:16px"><button class="btn" onclick="hide()">Cancel</button><button class="btn p" onclick="move('${id}',${s})">Save</button></div>`);
}
async function move(id,s){
 const i=S.items.find(x=>x.id===id),v=n($('g1').value);
 if(!v){$('g1').focus();return}
 if(s<0&&v>i.qty){$('err').textContent='Only '+i.qty+' in stock.';return}
 let cur=i.qty;
 if(DB){const r=await DB.from('items').select('qty').eq('id',id).single();if(r.data)cur=+r.data.qty}
 if(s<0&&v>cur){$('err').textContent='Only '+cur+' in stock.';return}
 i.qty=cur+s*v;i.upd=Date.now();DB.from('items').update({qty:i.qty,upd:i.upd}).eq('id',id).then(ok);addLog({t:Date.now(),name:i.name,d:s*v,note:$('g2').value.trim()||null});hide();render();
}
render();init();
</script></body></html>
